services:
  postgres:
    image: postgres:16-alpine
    container_name: effecti_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-erp_contracts}
      POSTGRES_USER: ${DB_USERNAME:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_secret}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-erp_user} -d ${DB_DATABASE:-erp_contracts}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: effecti_backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./back-end:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    container_name: effecti_nginx
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - ./back-end/public:/app/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - back-end
    networks:
      - app_net

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: effecti_frontend
    environment:
      API_PROXY_TARGET: http://nginx
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./front-end:/app
      - /app/node_modules
    depends_on:
      - nginx
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
